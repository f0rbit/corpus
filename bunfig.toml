[install]
# @f0rbit/lint's umbrella model needs transitive bins (oxlint, oxfmt, eslint)
# surfaced in node_modules/.bin — bun's isolated linker breaks that.
linker = "hoisted"

[test]
# org-wide 80% coverage floor. bun enforces this PER FILE, not just in
# aggregate — corpus is currently well under it in several files: sst.ts
# (0%/0% funcs/lines), cli/commands/cat.ts (50% funcs), cli/commands/show.ts
# (50% funcs), cli/config-schema.ts (0% funcs), testing/laws/equality.ts
# (42.86% lines). Declared here (single source of truth for the target) but
# NOT yet wired into CI's plain `bun test` step with --coverage, since that
# would gate on a threshold the repo doesn't meet today. See devpad backlog
# for the coverage sprint tracking these gap files; flip CI's "Run tests"
# step back to `bun test --coverage` once they're green.
coverageThreshold = 0.8
