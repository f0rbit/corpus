[install]
# @f0rbit/lint's umbrella model needs transitive bins (oxlint, oxfmt, eslint)
# surfaced in node_modules/.bin — bun's isolated linker breaks that.
linker = "hoisted"

[test]
# org-wide 80% coverage floor, enforced PER FILE (lines AND functions) by
# `bun test --coverage` — wired into `gate` and CI's test job.
coverageThreshold = 0.8
coveragePathIgnorePatterns = [
	# sst.ts is a pure SST v3 resource-naming helper whose only consumer is a
	# consumer's sst.config.ts; it can't run under bun test, so it's exempt.
	"sst.ts",
	# test code and its fixtures/fakes are not library surface
	"tests/**",
]
