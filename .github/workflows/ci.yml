name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Lint config drift check
        run: bunx f0rbit-lint check

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Lint
        run: bun run lint && bun run fmt:check

      - name: Build
        run: bun run build

      # zod 3 matrix: run the full suite a second time with zod 3.25.76
      # installed. Runs LAST so the typecheck/lint/build steps above validate
      # the dev install (zod 4); the script restores zod ^4.6.7 afterwards.
      - name: Test with zod 3
        run: bun run test:zod3
